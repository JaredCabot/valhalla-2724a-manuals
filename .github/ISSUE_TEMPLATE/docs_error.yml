name: Error in the documentation
description: Something in the documents is wrong, unclear or missing
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the correction. Errors found against real hardware or the original documents are the most valuable reports this project gets.
  - type: dropdown
    id: document
    attributes:
      label: Which document?
      options:
        - "2724A Operation Manual"
        - "2724A Service Manual"
        - "2724A Firmware Reference"
        - "README"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, section or address
      placeholder: "Service Manual, section 5.3, page 41"
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What it says now
      description: Copy the line, or describe the table or figure.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know?
      description: For the Operation and Service manuals, say whether the original scan says the same thing - the transcription follows the original, so an error in the original is still worth noting. For the Firmware Reference, say which build (standard or CPR) and what the instrument did.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Photos, captures or anything else that helps.
    validations:
      required: false
